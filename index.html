<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background-color: #f4f6f9; color: #333; text-align: center; 
    }
    .header {
      background-color: #002855; color: #ffffff; padding: 25px 15px;
      border-bottom: 6px solid #FFC72C; margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .header h2 { font-size: 1.1rem; font-weight: 500; color: #FFC72C; margin-bottom: 10px; }
    .header h3 { font-size: 0.95rem; font-weight: 300; opacity: 0.9; }
    .container { padding: 0 20px 40px 20px; max-width: 550px; margin: 0 auto; }
    select { 
      padding: 12px; width: 100%; font-size: 16px; border: 1px solid #ccc;
      border-radius: 6px; margin-bottom: 25px; background-color: #ffffff;
      color: #002855; font-weight: 600;
    }
    #reader { 
      width: 100%; border-radius: 8px; overflow: hidden; 
      box-shadow: 0 6px 12px rgba(0,0,0,0.1); background: #ffffff; border: 2px solid #002855;
    }
    #status { 
      margin-top: 25px; font-weight: bold; font-size: 1.2rem; padding: 15px; 
      border-radius: 8px; min-height: 60px; display: flex; align-items: center; justify-content: center;
    }
    .default { background-color: #e9ecef; color: #495057; border: 1px solid #ced4da; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Universidad Autónoma de Sinaloa</h1>
    <h2>Facultad de Ciencias Naturales y Exactas</h2>
    <h3>Docente: M.C. Adriana Alicia Barrios Rodríguez</h3>
  </div>
  
  <div class="container">
    <select id="materiaSelect">
      <option value="">Cargando materias...</option>
    </select>
    <div id="reader"></div>
    <div id="status" class="default">Esperando escaneo...</div>
  </div>

  <script>
    // --- REEMPLAZA ESTO CON LA URL DE TU APPS SCRIPT ---
    const API_URL = "https://script.google.com/a/macros/uas.edu.mx/s/AKfycbz8k_25kznunSFDekyeQudvELT7cZn-tdyCpo5JT7wHmn9Y8YS7CYBERR1IpvUColrt/exec";
    // ---------------------------------------------------

    fetch(API_URL + "?accion=obtenerMaterias")
      .then(res => res.json())
      .then(materias => {
        const select = document.getElementById('materiaSelect');
        select.innerHTML = '<option value="">-- Selecciona tu clase --</option>';
        materias.forEach(m => {
          let opt = document.createElement('option');
          opt.value = m; opt.innerHTML = m; select.appendChild(opt);
        });
      }).catch(err => console.error("Error conectando con la base de datos"));

    function onScanSuccess(decodedText, decodedResult) {
      const materia = document.getElementById('materiaSelect').value;
      const statusDiv = document.getElementById('status');

      if (!materia) {
        statusDiv.innerText = '⚠️ Primero selecciona una materia';
        statusDiv.className = 'error'; return;
      }

      statusDiv.innerText = 'Registrando...';
      statusDiv.className = 'warning';
      html5QrcodeScanner.pause();

      const urlRegistro = API_URL + "?accion=registrar&id=" + encodeURIComponent(decodedText) + "&materia=" + encodeURIComponent(materia);
      
      fetch(urlRegistro)
        .then(res => res.json())
        .then(data => {
          const resTexto = data.mensaje;
          statusDiv.innerText = resTexto;
          statusDiv.className = resTexto.includes('Retardo') ? 'warning' : (resTexto.includes('Error') ? 'error' : 'success');
          
          setTimeout(() => {
            statusDiv.innerText = 'Esperando escaneo...';
            statusDiv.className = 'default';
            html5QrcodeScanner.resume();
          }, 2500);
        })
        .catch(err => {
          statusDiv.innerText = 'Error de conexión.';
          statusDiv.className = 'error';
          setTimeout(() => html5QrcodeScanner.resume(), 2500);
        });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess, () => {});
  </script>
</body>
</html>
