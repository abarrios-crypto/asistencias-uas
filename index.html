<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia UAS</title>
    <!-- Librería para el escáner QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* --- ESTILOS PARA EL MENÚ Y VISTAS --- */
        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: #003366; /* Azul UAS */
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-btn {
            background-color: transparent;
            border: 2px solid #CC9900; /* Dorado UAS */
            padding: 10px 20px;
            color: #CC9900;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.activo {
            background-color: #CC9900;
            color: #003366; /* Letra azul al seleccionar */
        }

        /* Clases para ocultar y mostrar las pantallas */
        .vista {
            display: none;
            padding: 20px;
        }

        .vista-activa {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- ESTILOS DEL ESCÁNER Y FORMULARIO --- */
        select {
            padding: 10px;
            font-size: 16px;
            margin: 15px 0;
            width: 80%;
            max-width: 300px;
            border: 2px solid #003366;
            border-radius: 5px;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: white;
            border: 3px solid #003366;
            border-radius: 10px;
            overflow: hidden;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <div class="navbar">
        <button id="btn-escaner" class="nav-btn activo" onclick="cambiarVista('escaner')">📷 Escáner</button>
        <button id="btn-reportes" class="nav-btn" onclick="cambiarVista('reportes')">📊 Reportes</button>
    </div>

    <!-- VISTA 1: EL ESCÁNER -->
    <div id="vista-escaner" class="vista vista-activa">
        <h2 style="color: #003366;">Control de Asistencia UAS</h2>
        
        <label for="materia" style="font-weight: bold; color: #333;">Selecciona la Materia:</label><br>
        <select id="materia">
            <option value="">Cargando materias...</option>
        </select>

        <div id="reader"></div>
        <div id="mensaje"></div>
    </div>

    <!-- VISTA 2: LOS REPORTES -->
    <div id="vista-reportes" class="vista">
        <h2 style="color: #003366;">Panel de Asistencia y Reportes</h2>
        <p>Aquí se generará la tabla de estudiantes y las alertas de riesgo.</p>
        
        <!-- Botón preparado para la futura descarga del PDF -->
        <button style="background-color: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; font-size: 16px;">
            📄 Descargar Reporte PDF
        </button>

        <!-- Contenedor donde inyectaremos los datos de Google Sheets -->
        <div id="contenedor-tabla">
            <i>Cargando datos de los estudiantes... (Próximamente)</i>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN (¡PON TU URL AQUÍ!)
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzgskaZuX8AF7ne7zn0cWsx-lh6BNn9l8E5FLUd8KOoBDa_CDz0SKShc5eXcsa3GyH/exec"; 

        // ==========================================
        // 2. NAVEGACIÓN ENTRE VISTAS
        // ==========================================
function cambiarVista(vistaDestino) {
            document.getElementById('vista-escaner').classList.remove('vista-activa');
            document.getElementById('vista-reportes').classList.remove('vista-activa');
            document.getElementById('btn-escaner').classList.remove('activo');
            document.getElementById('btn-reportes').classList.remove('activo');
            
            if(vistaDestino === 'escaner') {
                document.getElementById('vista-escaner').classList.add('vista-activa');
                document.getElementById('btn-escaner').classList.add('activo');
            } else if (vistaDestino === 'reportes') {
                document.getElementById('vista-reportes').classList.add('vista-activa');
                document.getElementById('btn-reportes').classList.add('activo');
                
                // ¡AQUÍ ESTÁ LA MAGIA! Cargamos la tabla al abrir la pestaña
                cargarDatosReporte();
            }
        }

        // ==========================================
        // 3. OBTENER MATERIAS DEL EXCEL
        // ==========================================
        async function cargarMaterias() {
            try {
                const response = await fetch(SCRIPT_URL + "?accion=obtenerMaterias");
                const materias = await response.json();
                
                const selectMateria = document.getElementById("materia");
                selectMateria.innerHTML = '<option value="">-- Elige una materia --</option>';
                
                materias.forEach(materia => {
                    const option = document.createElement("option");
                    option.value = materia;
                    option.textContent = materia;
                    selectMateria.appendChild(option);
                });
            } catch (error) {
                console.error("Error al cargar materias:", error);
                document.getElementById("materia").innerHTML = '<option value="">Error al cargar materias</option>';
            }
        }

        // ==========================================
        // 4. LÓGICA DEL ESCÁNER QR
        // ==========================================
        let escaneando = false;

        function onScanSuccess(decodedText, decodedResult) {
            if (escaneando) return; // Bloquear lectura múltiple
            
            const materiaSeleccionada = document.getElementById("materia").value;
            const mensajeDiv = document.getElementById("mensaje");

            if (!materiaSeleccionada) {
                mensajeDiv.style.color = "red";
                mensajeDiv.innerText = "⚠️ Por favor, selecciona una materia primero.";
                return;
            }

            escaneando = true;
            mensajeDiv.style.color = "#003366";
            mensajeDiv.innerText = "⏳ Registrando matrícula " + decodedText + "...";

            // Enviar datos a Google Sheets y procesar respuesta real
    const url = `${SCRIPT_URL}?accion=registrarAsistencia&matricula=${encodeURIComponent(decodedText)}&materia=${encodeURIComponent(materiaSeleccionada)}&horaInicio=08:00`;

    fetch(url)
    .then(response => response.json())
    .then(resultado => {
        if (resultado.status === 'success') {
            mensajeDiv.style.color = "green";
            mensajeDiv.innerText = `✅ ${resultado.estatusRegistro.toUpperCase()}: ${resultado.alumno}`;
            
            // Si la función de refrescar reportes existe, la llamamos para actualizar la tabla
            if (typeof cargarDatosReporte === 'function') {
                cargarDatosReporte();
            }
        } else {
            mensajeDiv.style.color = "red";
            mensajeDiv.innerText = `⚠️ ${resultado.mensaje}`;
        }

        // Reiniciar el lector después de 3 segundos
        setTimeout(() => {
            mensajeDiv.innerText = "";
            escaneando = false;
        }, 3000);
    })
    .catch(error => {
        console.error("Error al registrar:", error);
        mensajeDiv.style.color = "red";
        mensajeDiv.innerText = "❌ Error de conexión con Google Sheets.";
        escaneando = false;
    });
    }

        function onScanFailure(error) {
            // Función requerida por la librería, la dejamos vacía para no saturar procesos
        }

        // Inicializar todo al cargar la página
        window.onload = function() {
            cargarMaterias();
            
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: {width: 250, height: 250} },
                false // MODO SILENCIOSO EN LA CONSOLA
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        };
        // ==========================================
        // 5. CARGAR Y DIBUJAR REPORTES
        // ==========================================
        async function cargarDatosReporte() {
            const contenedor = document.getElementById("contenedor-tabla");
            contenedor.innerHTML = "<i>Cargando datos desde Google Sheets... ⏳</i>";
            
            try {
                const response = await fetch(SCRIPT_URL + "?accion=obtenerReporte");
                const datos = await response.json();
                
                // Creamos el diseño de la tabla
                let tablaHTML = `<table style="width:100%; border-collapse: collapse; margin-top: 15px; background-color: white;">
                    <tr style="background-color: #003366; color: white;">
                        <th style="padding: 10px; border: 1px solid #ddd;">Matrícula</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">Nombre</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">Asist.</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">Faltas</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">Estado</th>
                    </tr>`;
                    
                datos.forEach(alumno => {
                    // Lógica visual: Si tiene 3 o más faltas, se pinta de rojo
                    let enRiesgo = alumno.faltas >= 3;
                    let colorEstado = enRiesgo ? "color: #d9534f; font-weight: bold;" : "color: #28a745;";
                    let textoEstado = enRiesgo ? "⚠️ En Riesgo" : "Regular";
                    
                    tablaHTML += `<tr>
                        <td style="padding: 8px; border: 1px solid #ddd;">${alumno.matricula}</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${alumno.nombre}</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${alumno.asistencias}</td>
                        <td style="padding: 8px; border: 1px solid #ddd; ${colorEstado}">${alumno.faltas}</td>
                        <td style="padding: 8px; border: 1px solid #ddd; ${colorEstado}">${textoEstado}</td>
                    </tr>`;
                });
                
                tablaHTML += "</table>";
                contenedor.innerHTML = tablaHTML;
                
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = "<i style='color: red;'>❌ Error al cargar los reportes. Revisa la conexión.</i>";
            }
        }
    </script>
</body>
</html>
